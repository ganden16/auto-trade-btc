services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=production
    ports:
      - "127.0.0.1:28080:28080"
    depends_on:
      - redis
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./.env:/app/.env
      - ./data:/app/data
      - ./public:/app/public
      - ./src:/app/src
      - ./services:/app/services
      - ./config:/app/config
      - ./package.json:/app/package.json
      - ./test:/app/test
    
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "127.0.0.1:26379:6379"
    volumes:
      - redis_data:/data

  build-app:
    build:
      context: .
      dockerfile: Dockerfile.builder
    volumes:
      - ./build:/app/build
    dns:
      - 8.8.8.8
      - 1.1.1.1
    profiles:
      - build

  deploy-vps:
    image: node:20-alpine
    volumes:
      - .:/app
      - ~/.ssh:/root/.ssh:ro
    environment:
      - VPS_IP=${VPS_IP:-}
      - VPS_USER=${VPS_USER:-ubuntu}
      - VPS_PASS=${VPS_PASS:-}
    command: >
      sh -c "if [ -z \"$$VPS_IP\" ]; then
               echo '[ERROR] Variabel VPS_IP wajib diisi di file .env!' >&2;
               exit 1;
             fi &&
             apk add --no-cache sshpass openssh-client &&
             if [ -f /root/.ssh/id_ed25519 ] || [ -f /root/.ssh/id_rsa ]; then
               SSH_BASE=\"ssh -o StrictHostKeyChecking=no\";
             elif [ -n \"$$VPS_PASS\" ]; then
               SSH_BASE=\"sshpass -p '$$VPS_PASS' ssh -o StrictHostKeyChecking=no\";
             else
               echo '[ERROR] Kunci SSH (~/.ssh/id_ed25519) atau VPS_PASS diperlukan!' >&2;
               exit 1;
             fi &&
             $$SSH_BASE \"$$VPS_USER@$$VPS_IP\" 'mkdir -p /home/ubuntu/bot-trading' &&
             tar -czf - --exclude='node_modules' --exclude='.git' --exclude='build' --exclude='data/*.db*' --exclude='.env' -C /app src config services public test Dockerfile docker-compose.yml package.json .env.example |
             $$SSH_BASE \"$$VPS_USER@$$VPS_IP\" 'tar -xzf - -C /home/ubuntu/bot-trading' &&
             DASH_PWD=$$(grep -E '^DASHBOARD_PASSWORD=' /app/.env 2>/dev/null | cut -d= -f2-) &&
             if [ -n \"$$DASH_PWD\" ]; then
               $$SSH_BASE \"$$VPS_USER@$$VPS_IP\" \"grep -q '^DASHBOARD_PASSWORD=' /home/ubuntu/bot-trading/.env && sed -i \\\"s|^DASHBOARD_PASSWORD=.*|DASHBOARD_PASSWORD=$$DASH_PWD|\\\" /home/ubuntu/bot-trading/.env || echo \\\"DASHBOARD_PASSWORD=$$DASH_PWD\\\" >> /home/ubuntu/bot-trading/.env\";
             fi &&
             $$SSH_BASE \"$$VPS_USER@$$VPS_IP\" 'cd /home/ubuntu/bot-trading && docker compose up -d && docker compose restart bot' &&
             echo '' &&
             echo '==========================================================' &&
             echo '  SYNC & RESTART BERHASIL (VIA SECURE SSH KEY)!           ' &&
             echo '  Dasbor Web VPS: https://'$$VPS_IP'.sslip.io             ' &&
             echo '=========================================================='"
    profiles:
      - deploy

volumes:
  redis_data:
